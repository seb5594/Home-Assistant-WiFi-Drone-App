configuration:
  source_url:
    name: Kamera-URL
    description: "RTSP-, HTTP(S)-, kyufo://, jieli:// oder lewei://-Kameraquelle."
  api_token:
    name: Bridge-API-Token
    description: "Mindestens 16 druckbare ASCII-Zeichen ohne Leerzeichen. Leer lassen, um die API zu deaktivieren."
  rtsp_transport:
    name: RTSP-Transport
    description: "TCP oder UDP für den RTP-Transport."
  copy_mjpeg:
    name: Originale JPEG-Bilder beibehalten
    description: "Nur für Quellen aktivieren, die bereits als MJPEG kodiert sind."
  wifi_ssid:
    name: WLAN der Drohne
    description: "Exakter Name des Access Points für WiFi App Helper. Für eine bereits erreichbare Kamera leer lassen."
  wifi_password:
    name: WLAN-Passwort der Drohne
    description: "Passwort für WPA2-Personal. Bei einem offenen Drohnen-WLAN leer lassen."
  wifi_interface:
    name: Dedizierter WLAN-Adapter
    description: "Name einer freien, geeigneten Schnittstelle. Wenn genau eine verfügbar ist, genügt ein leeres Feld."
  wifi_helper_host:
    name: Host des WiFi App Helpers
    description: "Home-Assistant-Hostname des WiFi App Helpers. Der Standard passt zum offiziellen App-Repository; bei lokaler Installation local-wifi-helper verwenden. Ein Kopplungsgeheimnis ist nicht nötig."
  record_traffic:
    name: Drohnen-Verkehr aufzeichnen
    description: "Speichert alles, was der Drohnen-Adapter sendet und empfängt, als pcap-Datei für Wireshark (siehe Dokumentation der App). Dateien nach der Analyse löschen; sie können Gerätekennungen enthalten."
